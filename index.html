<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clouds Above</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas { display: block; }
  </style>
</head>
<body>

<!-- Phaser CDN -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

<script>
/* ================= HOME SCREEN ================= */

class HomeScreen extends Phaser.Scene {
  constructor() { super({ key: "HomeScreen" }); }

  create() {
    this.cameras.main.setBackgroundColor("#6ec6ff");

    this.add.text(625, 80, "Clouds Above", {
      fontFamily: "Arial",
      fontSize: 64,
      color: "#ffffff",
      fontStyle: "bold"
    }).setOrigin(0.5);

    const play = this.add.text(625, 300, "PLAY", {
      fontFamily: "Arial",
      fontSize: 40,
      color: "#000",
      backgroundColor: "#fff",
      padding: { left: 20, right: 20, top: 10, bottom: 10 }
    }).setOrigin(0.5).setInteractive();

    play.on("pointerover", () => play.setStyle({ backgroundColor: "#000", color: "#fff" }));
    play.on("pointerout",  () => play.setStyle({ backgroundColor: "#fff", color: "#000" }));
    play.on("pointerdown", () => this.scene.start("GameScreen"));
  }
}

/* ================= GAME SCREEN ================= */

class GameScreen extends Phaser.Scene {
  constructor() { super({ key: "GameScreen" }); }

  create() {
    this.cameras.main.setBackgroundColor("#6ec6ff");

    // Generate square player
    const size = 60;
    const g = this.add.graphics();
    g.fillStyle(0xffffff, 1);
    g.fillRect(0, 0, size, size);
    g.generateTexture("playerSquare", size, size);
    g.destroy();

    // Generate platform
    const platW = 300, platH = 200;
    const g2 = this.add.graphics();
    g2.fillStyle(0xdddddd, 1);
    g2.fillRect(0, 0, platW, platH);
    g2.generateTexture("platformRect", platW, platH);
    g2.destroy();

    this.platform = this.physics.add.staticImage(625, 450, "platformRect");
    this.platform.refreshBody();

    this.player = this.physics.add.sprite(625, 350, "playerSquare");
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(size, size, true);

    this.speed = 200;

    this.keys = this.input.keyboard.addKeys({
      up: "W", down: "S", left: "A", right: "D"
    });
  }

  update() {
    if (this.keys.left.isDown) this.player.setVelocityX(-this.speed);
    else if (this.keys.right.isDown) this.player.setVelocityX(this.speed);
    else this.player.setVelocityX(0);

    if (this.keys.up.isDown) this.player.setVelocityY(-this.speed);
    else if (this.keys.down.isDown) this.player.setVelocityY(this.speed);
    else this.player.setVelocityY(0);

    // Clamp to platform
    const p = this.platform.getBounds();
    const hw = this.player.displayWidth / 2;
    const hh = this.player.displayHeight / 2;

    this.player.x = Phaser.Math.Clamp(this.player.x, p.left + hw, p.right - hw);
    this.player.y = Phaser.Math.Clamp(this.player.y, p.top + hh, p.bottom - hh);
  }
}

/* ================= CONFIG ================= */

const config = {
  type: Phaser.AUTO,
  width: 1250,
  height: 825,
  scene: [HomeScreen, GameScreen],
  physics: {
    default: "arcade",
    arcade: { gravity: { y: 0 }, debug: false }
  }
};

new Phaser.Game(config);
</script>
</body>
</html>
